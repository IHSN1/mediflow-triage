# ==========================================================================
# Configuration de l'application MediFlow AI - Backend Spring Boot
# ==========================================================================

# Nom de l'application (apparait dans les logs de démarrage)
spring.application.name=mediflow-backend

# Port d'écoute de l'API REST. Le frontend (TanStack Start) tourne sur le
# port 5173 et appelle cette API sur le port 8080.
server.port=8080

# --------------------------------------------------------------------------
# Base de données PostgreSQL (Neon)
# --------------------------------------------------------------------------
# Valeurs fournies via variables d'environnement (jamais en dur dans le code
# source). Neon exige une connexion chiffrée : l'URL JDBC doit se terminer
# par ?sslmode=require. Exemple d'URL Neon :
#   jdbc:postgresql://ep-xxx-xxx.eu-central-1.aws.neon.tech/mediflow?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------------------------------------------------------
# JPA / Hibernate
# --------------------------------------------------------------------------
# "update" : Hibernate crée/modifie automatiquement les tables users et
# triages au démarrage à partir des entités Java (aucun script SQL manuel
# n'est nécessaire). À remplacer par "validate" une fois en production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Affiche les requêtes SQL générées dans la console (utile en développement).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --------------------------------------------------------------------------
# JWT (JSON Web Token)
# --------------------------------------------------------------------------
# Clé secrète utilisée pour signer les tokens (algorithme HS256 : au moins
# 256 bits, donc 32 caractères minimum), fournie via variable d'environnement.
jwt.secret=${JWT_SECRET}
# Durée de validité du token en millisecondes (ici : 8 heures maximum, une
# durée de garde standard en milieu hospitalier — ISO 27001, limitation de la
# durée des sessions). Passé ce délai, le token expire : les requêtes
# suivantes échouent avec 401 et l'utilisateur doit se reconnecter.
jwt.expiration-ms=28800000

# --------------------------------------------------------------------------
# Service IA FastAPI (agent conversationnel + modèle XGBoost)
# --------------------------------------------------------------------------
# Spring Boot agit comme gateway : le frontend n'appelle jamais FastAPI
# directement, tout passe par /api/triage/*.
fastapi.base-url=http://localhost:8000

# --------------------------------------------------------------------------
# CORS
# --------------------------------------------------------------------------
# Origine autorisée à appeler cette API (le frontend en développement).
cors.allowed-origin=http://localhost:5173

# --------------------------------------------------------------------------
# Gestion des erreurs
# --------------------------------------------------------------------------
# Inclut le message d'erreur détaillé dans les réponses JSON d'erreur
# (utile pour afficher les messages métier, ex. "Email ou mot de passe incorrect").
server.error.include-message=always
